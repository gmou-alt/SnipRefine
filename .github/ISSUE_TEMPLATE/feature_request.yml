name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你现在的使用场景里，哪里不方便？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 其它软件的做法
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: 请确认（本项目有几条硬性约束）
      options:
        - label: 该需求不需要引入第三方库或联网
          required: true
        - label: 该需求可以用 C# 5 语法实现（构建依赖系统自带编译器）
          required: true
