name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        shell: cmd
        run: |
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /help | findstr /i "Version"

      - name: Build
        shell: cmd
        run: scripts\build.cmd

      - name: Pack release zip
        shell: cmd
        run: scripts\pack.cmd

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnipRefine-win
          path: dist/*.zip
          if-no-files-found: error

